<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Temperature Converter</h1>
    <p class="intro">Enter a temperature and choose its unit to see it in Celsius, Fahrenheit and Kelvin.</p>

    <form id="converter" novalidate>
      <div class="field">
        <label for="value">Temperature</label>
        <input id="value" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 25" aria-describedby="error">
      </div>

      <div class="field">
        <label for="unit">Convert from</label>
        <select id="unit">
          <option value="C">Celsius (°C)</option>
          <option value="F">Fahrenheit (°F)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </div>

      <p id="error" class="error" role="alert"></p>

      <button type="submit" class="btn">Convert</button>
    </form>

    <section class="results" aria-live="polite">
      <h2>Result</h2>
      <ul id="results">
        <li><span>Celsius</span><strong id="out-C">–</strong></li>
        <li><span>Fahrenheit</span><strong id="out-F">–</strong></li>
        <li><span>Kelvin</span><strong id="out-K">–</strong></li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
